name: Repos Atom

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not commit or push)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: repos-atom

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('repos-atom/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Track new entries
        run: python repos_atom.py

      - name: Check for changes
        id: check_changes
        run: |
          changed=false
          for ft in releases tags commits; do
            if git status --porcelain | grep -q "repos-${ft}.txt"; then
              changed=true
            fi
          done
          echo "changes=${changed}" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ft in releases tags commits; do
            if git status --porcelain | grep -q "repos-${ft}.txt"; then
              git add "repos-${ft}.txt"
            fi
          done
          git commit -m "chore: update repos tracker txt files [skip ci]"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repos-tracker-txt
          path: |
            repos-atom/repos-releases.txt
            repos-atom/repos-tags.txt
            repos-atom/repos-commits.txt
          retention-days: 30
          if-no-files-found: ignore
