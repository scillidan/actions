name: Vicinae Extensions

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not commit or push)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vicinae-extensions

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('vicinae-extensions/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Track new extensions
        run: python vicinae_extensions.py

      - name: Check for changes
        id: check_changes
        run: |
          changed=false
          for f in state.json vicinae-updates.txt vicinae-feed.xml; do
            if git status --porcelain | grep -q "$f"; then
              changed=true
            fi
          done
          echo "changes=${changed}" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true' && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json vicinae-updates.txt vicinae-feed.xml; do
            if git status --porcelain | grep -q "$f"; then
              git add "$f"
            fi
          done
          git commit -m "chore: update vicinae extensions feed [skip ci]"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vicinae-extensions
          path: |
            vicinae-extensions/state.json
            vicinae-extensions/vicinae-updates.txt
            vicinae-extensions/vicinae-feed.xml
          retention-days: 30
          if-no-files-found: ignore
