name: Scoop Manifests (CSV)

on:
  push:
    paths:
      - "scoop-manifests/buckets.txt"
      - "scoop-manifests/scoop_git_to_csv.py"
      - ".github/workflows/scoop-manifests.yml"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not commit or push)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scoop-manifests

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore bucket clone cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4
        with:
          path: scoop-manifests/.cache
          key: scoop-manifests-cache-${{ hashFiles('scoop-manifests/buckets.txt') }}
          restore-keys: |
            scoop-manifests-cache-

      - name: Restore GitHub status cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4
        with:
          path: scoop-manifests/.cache/github-status.json
          key: scoop-manifests-github-status-${{ hashFiles('scoop-manifests/scoop_git_to_csv.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scoop-manifests-github-status-${{ hashFiles('scoop-manifests/scoop_git_to_csv.py') }}-
            scoop-manifests-github-status-

      - name: Generate CSVs from bucket history
        run: python3 scoop_git_to_csv.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate outputs
        run: |
          set -euo pipefail
          test -s scoop-manifests.meta.json || { echo "meta json missing"; exit 1; }

          # Every bucket URL in buckets.txt must produce a non-empty added CSV.
          while read -r url; do
            case "$url" in
              ''|\#*) continue ;;
            esac
            name=$(basename "$url" .git | tr '[:upper:]' '[:lower:]')
            if [ ! -s "added_${name}.csv" ]; then
              echo "added_${name}.csv appears empty or invalid"
              exit 1
            fi
            head -n 1 "added_${name}.csv" | grep -qx "name,added_date,description" || {
              echo "added_${name}.csv has unexpected header"
              exit 1
            }
          done < buckets.txt

          test -s archived.csv
          test -s broken_home.csv
          test -s inactive.csv
          test -s deprecated.csv
          head -n 1 archived.csv | grep -qx "bucket,name,archived_date"
          head -n 1 broken_home.csv | grep -qx "bucket,name,broken_home"
          head -n 1 inactive.csv | grep -qx "bucket,name,latest_update"
          head -n 1 deprecated.csv | grep -qx "bucket,name,deprecated_date,description"

          ls -la added_*.csv archived.csv broken_home.csv inactive.csv deprecated.csv scoop-manifests.meta.json

      - name: Check for changes
        id: changes
        run: |
          git add -A -- .
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: |
          steps.changes.outputs.changed == 'true' &&
          inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update scoop manifests from bucket history [skip ci]"
          git push

      - name: Dry run notice
        if: inputs.dry_run == 'true'
        run: |
          echo "::notice title=Dry Run::Dry run enabled — no commit or push performed"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scoop-manifests-csv-${{ github.run_id }}
          path: |
            scoop-manifests/buckets.txt
            scoop-manifests/added_*.csv
            scoop-manifests/archived.csv
            scoop-manifests/broken_home.csv
            scoop-manifests/inactive.csv
            scoop-manifests/deprecated.csv
            scoop-manifests/scoop-manifests.meta.json
          retention-days: 90
